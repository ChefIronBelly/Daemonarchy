hostname="momofuku"
zfs_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"
powerd_enable="YES"
dumpdev="AUTO"
clear_tmp_enable="YES"

# Omarchy's session: D-Bus, seat access, and the SDDM login.
dbus_enable="YES"
seatd_enable="YES"
sddm_enable="YES"
keymap="us"

#ifconfig_DEFAULT="DHCP"
ifconfig_re0="inet 10.0.0.64 netmask 255.255.255.0"
defaultrouter="10.0.0.1"

# Bounded boot with the first usable connection (daemonarchy-netselect).
background_dhclient="YES"
defaultroute_delay="10"
defaultroute_carrier_delay="5"

daemonarchy_graphics_enable="YES"
daemonarchy_graphics_modules="amdgpu"
devmatch_blocklist="amdgpu radeonkms i915kms nvidia nvidia-modeset nvidia-drm virtio_gpu_drm"
avahi_daemon_enable="YES"
